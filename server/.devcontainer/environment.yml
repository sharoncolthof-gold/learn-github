name: server_env
channels:
  - conda-forge
  - defaults
dependencies:
  # run
  - python=3.10
  - pydantic=2
  - fastapi=0.115.3
  - uvicorn-standard=0.32.0
  - motor=3.6.0
  - orjson=3.10.11

  # dev
  - jupyterlab
  - pylint
  - autopep8
  - memory_profiler

  # test
  - pytest>8
  - pytest-asyncio
  - pytest-cov
  - pytest-mock

